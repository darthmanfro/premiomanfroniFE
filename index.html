<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premio Manfroni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Contenitore Notifiche Auto-dismissing -->
<div id="notification" class="notification hidden"></div>

<main class="container">

  <!-- VISTA 1: LANDING & AUTH -->
  <section id="auth-view" class="view">
    <header class="hero">
      <h1>Premio Manfroni</h1>
    </header>

    <div class="auth-card">
      <!-- Switch Tab -->
      <div class="auth-tabs">
        <button id="tab-login-btn" class="tab-btn active" onclick="switchAuthTab('login')">Accedi</button>
        <button id="tab-register-btn" class="tab-btn" onclick="switchAuthTab('register')">Registrati</button>
      </div>

      <!-- Form Login -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- Form Registrazione -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="reg-confirm-password">Ripeti Password</label>
          <input type="password" id="reg-confirm-password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Registrati</button>
      </form>
    </div>
  </section>

  <!-- VISTA 2: LISTA PREMI -->
  <section id="dashboard-view" class="view hidden">
    <header class="dashboard-header">
      <h2>Elenco Premi</h2>
      <button onclick="handleLogout()" class="btn btn-secondary">Logout</button>
    </header>

    <div id="awards-list" class="awards-grid">
      <!-- Caricati dinamicamente via JS -->
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
